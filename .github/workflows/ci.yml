name: ci

# check_bridge.py runs the bridge against a real MQTT broker and a fake SidePulse.
# check_service.py runs it against a real SidePulse service. The pinned commits are
# regression tests. SidePulse main also runs every week, so a breaking change
# upstream shows up here first.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Start an MQTT broker
        run: |
          docker run -d --name broker -p 127.0.0.1:18830:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          timeout 30 sh -c 'until nc -z 127.0.0.1 18830; do sleep 0.5; done'
      - run: ./check_bridge.py

  # Installs SidePulse at one commit, starts its real service, and runs the bridge
  # against it. The service came with the first commit below. Before it, the menu-bar
  # app wrote the device, and that app only runs on macOS.
  sidepulse:
    name: sidepulse ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 2026-11-10, first with the service
            ref: ad4a5217fd3a833cfa2a12e1eaf055f22948cd53
          - name: 2026-11-12
            ref: 20ca7fdd6645ba070af607e24587084b6f809275
          - name: main
            ref: main
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: inteliwear/sidepulse
          ref: ${{ matrix.ref }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: python -m venv .venv && .venv/bin/pip install ./upstream
      - run: .venv/bin/sidepulse --version
      - name: Start an MQTT broker
        run: |
          docker run -d --name broker -p 127.0.0.1:18830:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          timeout 30 sh -c 'until nc -z 127.0.0.1 18830; do sleep 0.5; done'
      - run: ./check_service.py
        env:
          SIDEPULSE_BIN: ${{ github.workspace }}/.venv/bin/sidepulse
